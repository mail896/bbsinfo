# Include inside the apps.school.example HTTPS VirtualHost after bbsinfo.service is ready.
RedirectMatch 302 ^/bbsinfo$ /bbsinfo/
ProxyPass /bbsinfo/ unix:/run/bbsinfo/backend.sock|http://bbsinfo-backend/bbsinfo/ connectiontimeout=3 timeout=30
ProxyPassReverse /bbsinfo/ http://bbsinfo-backend/bbsinfo/
<Location /bbsinfo/>
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "same-origin"
</Location>
<LocationMatch "^/bbsinfo/assets/logo-mappe\.png$">
    # Firefox speichert Favicons mit no-store nicht in der Lesezeichenleiste.
    # Den Cache-Header des Backends entfernen, damit nur ein Wert ausgegeben wird.
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-cache"
</LocationMatch>
